# version: 1.0.0
"$schema" = "https://starship.rs/config-schema.json"

# palette = "tokio-night"
add_newline = true

format = """
${custom.os}\
$shell\
${custom.compress_path}\
${custom.git_remote}\
$git_branch\
$git_status\
$fill\
$c\
$java\
$kotlin\
$lua\
$python\
$rust\
$cmd_duration\
${custom.date}\
${custom.clock}\
${custom.battery}\
${custom.headphone}\
${custom.mouse}\
${custom.keyboard}\
$line_break\
$character\
"""

right_format = """
${custom.opencode-quota}\
${custom.deepseek-quota}\
${custom.user}\
${custom.hostname}\
${custom.docker_host}\
"""


[custom.os]
command = '${STARSHIP_CONFIG%/*}/scripts/os.sh'
when = '${STARSHIP_CONFIG%/*}/scripts/os.sh --guard'
shell = ["bash"]
style = "bold"
format = "[$output]($style) "

[shell]
disabled = false
style = "bold bright-black"
format = "[$indicator]($style) "
unknown_indicator = "unknown-shell"
bash_indicator = " bash"
fish_indicator = "󰈺 fish"
nu_indicator = " nu"
zsh_indicator = " zsh"

[custom.compress_path]
command = '${STARSHIP_CONFIG%/*}/scripts/path.sh'
when = "true"
shell = ["bash"]
style = "bold bright-blue"
format = "[$output]($style) "

[git_branch]
symbol = ""
style = "green"
format = "[$branch]($style) "

[custom.git_remote]
command = '${STARSHIP_CONFIG%/*}/scripts/git-remote.sh'
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
shell = ["bash"]
style = "bold white"
format = "[$output]($style) "

[git_status]
style = "bright-yellow"
format = "[$all_status$ahead_behind]($style)"
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↑${ahead_count} ↓${behind_count} "
conflicted = "~${count} "
deleted = "✗${count} "
renamed = "→${count} "
modified = "!${count} "
staged = "✓${count} "
stashed = "≡${count} "
untracked = "?${count} "


[fill]
symbol = "·"
style = "dimmed bright-black"


[c]
symbol = " "
format = " [$symbol($version)]($style)"
detect_files = ["CMakeLists.txt"]
detect_extensions = ["c", "h", "cpp", "hpp"]

[java]
symbol = "󰬷 "
format = " [$symbol($version)]($style)"

[kotlin]
symbol = "󱈙 "
format = " [$symbol($version)]($style)"

[lua]
symbol = "󰢱 "
format = " [$symbol($version)]($style)"

[python]
symbol = "󰌠 "
format = " [$symbol($version)($virtualenv)]($style)"

[rust]
symbol = "󱘗 "
format = " [$symbol($version)]($style)"


[cmd_duration]
min_time = 1000
format = " [󰦖 $duration]($style)"
style = "yellow"

[time]
disabled = true

[custom.date]
command = "date '+%y-%m-%d %a'"
when = '! ${STARSHIP_CONFIG%/*}/scripts/layout.sh is narrow'
shell = ["bash"]
style = "dimmed bright-cyan"
format = " [󰃭 $output]($style)"

[custom.clock]
command = """
icons=("" "" "" "" "" "" "" "" "" "" "" "" "")
echo "${icons[$(date +%-I)]} $(date +'%I:%M %p')"
"""
when = '! ${STARSHIP_CONFIG%/*}/scripts/layout.sh is narrow'
shell = ["bash"]
style = "dimmed bright-cyan"
format = " [$output]($style)"

[battery]
disabled = true

[custom.battery]
command = '${STARSHIP_CONFIG%/*}/scripts/battery.sh --display'
when = '${STARSHIP_CONFIG%/*}/scripts/battery.sh --guard'
shell = ["bash"]
format = " $output"

[custom.headphone]
command = '${STARSHIP_CONFIG%/*}/scripts/headphone.sh --display'
when = '${STARSHIP_CONFIG%/*}/scripts/headphone.sh --guard'
shell = ["bash"]
format = " $output"

[custom.mouse]
command = '${STARSHIP_CONFIG%/*}/scripts/mouse.sh --display'
when = '${STARSHIP_CONFIG%/*}/scripts/mouse.sh --guard'
shell = ["bash"]
format = " $output"

[custom.keyboard]
command = '${STARSHIP_CONFIG%/*}/scripts/keyboard.sh --display'
when = '${STARSHIP_CONFIG%/*}/scripts/keyboard.sh --guard'
shell = ["bash"]
format = " $output"

[character]
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"

[custom.opencode-quota]
command = '${STARSHIP_CONFIG%/*}/scripts/opencode-quota.sh'
when = '${STARSHIP_CONFIG%/*}/scripts/opencode-quota.sh --guard'
shell = ["bash"]
style = "white"
format = " [$output]($style)"

[custom.llm-quota]
command = '${STARSHIP_CONFIG%/*}/scripts/llm-quota.sh'
when = '${STARSHIP_CONFIG%/*}/scripts/llm-quota.sh --guard'
shell = ["bash"]
style = "purple"
format = " [$output]($style)"

[custom.deepseek-quota]
command = '${STARSHIP_CONFIG%/*}/scripts/deepseek-quota.sh'
when = '${STARSHIP_CONFIG%/*}/scripts/deepseek-quota.sh --guard'
shell = ["bash"]
style = "bright-blue"
format = " [$output]($style)"

[custom.kimi-quota]
command = '${STARSHIP_CONFIG%/*}/scripts/kimi-quota.sh'
when = '${STARSHIP_CONFIG%/*}/scripts/kimi-quota.sh --guard'
shell = ["bash"]
style = "bright-cyan"
format = " [$output]($style)"

[username]
disabled = true

[custom.user]
command = '${STARSHIP_CONFIG%/*}/scripts/user.sh --display'
when = '${STARSHIP_CONFIG%/*}/scripts/user.sh --guard'
shell = ["bash"]
format = " $output"

[custom.hostname]
command = '${STARSHIP_CONFIG%/*}/scripts/hostname.sh'
when = '${STARSHIP_CONFIG%/*}/scripts/hostname.sh --guard'
shell = ["bash"]
style = "dimmed green"
format = " [$output]($style)"


[custom.docker_host]
command = 'echo "${CONTAINER_NAME:-${COMPOSE_SERVICE}}"'
when = "test -f /.dockerenv"
shell = ["bash"]
style = "dimmed blue"
format = " [󰡨 $output]($style)"


