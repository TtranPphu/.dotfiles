# Status bar
set -g status-position top
set -g status-interval 15
setw -g monitor-bell on
set -g window-status-bell-style "fg=green"
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 100
set -g window-status-separator "#[fg=brightblack,bold]┊"

# Restyle tmux's native window-list clipping markers into ❮/❯ overflow indicators
run-shell -b '#{@tmux-hook}/overflow-init.sh #{q:socket_path}'

set -gw automatic-rename off

# Theme
set -g status-style "bg=default,fg=default"

# Status glyphs (@nerd_font_*) are set from the icon catalog by
# support/nerd-font-tmux.sh based on the nerd-font type (nerd/mono/lame).

set -g status-left "\
#(#{@tmux-status}/left.sh\
 #{q:socket_path}\
 #{q:session_name}\
 #{client_width} #{client_pid})\
"
set -g status-right "\
#[default]\
#(#{@tmux-status}/right.sh\
 #{q:socket_path}\
 #{q:session_name}\
 #{q:pane_id}\
 #{client_width} sessions\
 #{client_pid})\
#[fg=brightblack,bold]\
#{?client_prefix,#{?#{==:#{@nerd_font},nerd},#[bg=magenta#,bold] #{@nerd_font_prefix}#{@nerd_font_separator_tail},#[bg=magenta#,bold]#{@nerd_font_separator_head}#{@nerd_font_prefix}#{@nerd_font_separator_tail}},}\
#{?#{==:#{pane_mode},copy-mode},#{?#{==:#{@nerd_font},nerd},#[bg=cyan#,bold] #{@nerd_font_copy}#{@nerd_font_separator_tail},#[bg=cyan#,bold]#{@nerd_font_separator_head}#{@nerd_font_copy}#{@nerd_font_separator_tail}},}\
#{?#{==:#{pane_mode},tree-mode},#{?#{==:#{@nerd_font},nerd},#[bg=cyan#,bold] #{@nerd_font_tree}#{@nerd_font_separator_tail},#[bg=cyan#,bold]#{@nerd_font_separator_head}#{@nerd_font_tree}#{@nerd_font_separator_tail}},}\
#{?window_zoomed_flag,#{?#{==:#{@nerd_font},nerd},#[bg=green#,bold] #{@nerd_font_zoom}#{@nerd_font_separator_tail},#[bg=green#,bold]#{@nerd_font_separator_head}#{@nerd_font_zoom}#{@nerd_font_separator_tail}},}\
#[default]\
#(#{@tmux-status}/right.sh\
 #{q:socket_path}\
 #{q:session_name}\
 #{q:pane_id}\
 #{client_width} rest\
 #{client_pid})\
"
set -g window-status-format " #{?window_bell_flag,#[fg=green#,bold]#{@nerd_font_bell},#[fg=brightblack#,bold]#{@nerd_font_win}}#(#{@tmux-status}/window-name.sh --cached #{q:pane_tty} #{q:pane_current_command}) "
set -g window-status-current-format "#[fg=blue,bg=brightblack,bold] #{@nerd_font_win_active}#(#{@tmux-status}/window-name.sh --cached #{q:pane_tty} #{q:pane_current_command}) "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
