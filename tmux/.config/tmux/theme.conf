# Status bar
set -g status-position top
set -g status-interval 5
setw -g monitor-bell on
set -g window-status-bell-style "fg=green"
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 100
set -g window-status-separator "#[fg=brightblack,bold]┊"

# Restyle tmux's native window-list clipping markers into ❮/❯ overflow indicators
run-shell -b '#{@tmux-hook}/overflow-init.sh #{q:socket_path}'

set -gw automatic-rename off

# Theme
set -g status-style "bg=default,fg=default"

# Status glyphs (@nerd_font_*) are set from the icon catalog by
# support/nerd-font-tmux.sh based on the nerd-font mode (nerd/lame).

set -g status-left "\
#(#{@tmux-status}/left.sh\
 #{q:socket_path}\
 #{q:session_name}\
 #{client_width})\
"
set -g status-right "\
#[default]\
#(#{@tmux-status}/right.sh\
 #{q:socket_path}\
 #{q:session_name}\
 #{q:pane_id}\
 #{client_width} sessions)\
#[fg=colour233,bold]\
#{?client_prefix,#{?#{==:#{@nerd_font},lame},#[bg=magenta#,bold]▏#{@nerd_font_prefix}▕,#[bg=magenta#,bold] #{@nerd_font_prefix} ▐},}\
#{?#{==:#{pane_mode},copy-mode},#{?#{==:#{@nerd_font},lame},#[bg=cyan#,bold]▏#{@nerd_font_copy}▕,#[bg=cyan#,bold] #{@nerd_font_copy} ▐},}\
#{?#{==:#{pane_mode},tree-mode},#{?#{==:#{@nerd_font},lame},#[bg=cyan#,bold]▏#{@nerd_font_tree}▕,#[bg=cyan#,bold] #{@nerd_font_tree} ▐},}\
#{?window_zoomed_flag,#{?#{==:#{@nerd_font},lame},#[bg=green#,bold]▏#{@nerd_font_zoom}▕,#[bg=green#,bold] #{@nerd_font_zoom} ▐},}\
#[default]\
#(#{@tmux-status}/right.sh\
 #{q:socket_path}\
 #{q:session_name}\
 #{q:pane_id}\
 #{client_width} rest)\
"
set -g window-status-format " #{?window_bell_flag,#[fg=green#,bold]#{@nerd_font_bell},#[fg=brightblack#,bold]#{@nerd_font_win}}#(#{@tmux-status}/window-name.sh #{q:pane_tty} #{q:pane_current_command}) "
set -g window-status-current-format "#[fg=blue,bg=brightblack,bold] #{@nerd_font_win}#(#{@tmux-status}/window-name.sh #{q:pane_tty} #{q:pane_current_command}) "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
