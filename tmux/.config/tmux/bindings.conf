# Vi mode for copy
setw -g mode-keys vi
bind e copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# PgUp/PgDn for half-page scroll (replace C-u/C-d)
unbind -T copy-mode-vi C-u
unbind -T copy-mode-vi C-d
bind -T copy-mode-vi PageUp send -X halfpage-up
bind -T copy-mode-vi PageDown send -X halfpage-down

# Home/End for first/last non-space char
bind -T copy-mode-vi Home send -X back-to-indentation
bind -T copy-mode-vi End send -X end-of-line

# Pane Controls
# Leave h/v unbound after prefix so auto-split app shortcuts own those keys.
# This also prevents tmux defaults or plugins from reintroducing pane splits here.
unbind h
unbind v
bind x kill-pane
bind z resize-pane -Z

bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

bind -n C-M-Left display-message "Use Ctrl-Meta(Alt)-h/j/k/l for pane navigation"
bind -n C-M-Right display-message "Use Ctrl-Meta(Alt)-h/j/k/l for pane navigation"
bind -n C-M-Up display-message "Use Ctrl-Meta(Alt)-h/j/k/l for pane navigation"
bind -n C-M-Down display-message "Use Ctrl-Meta(Alt)-h/j/k/l for pane navigation"

bind -n C-M-S-h resize-pane -L 5
bind -n C-M-S-j resize-pane -D 5
bind -n C-M-S-k resize-pane -U 5
bind -n C-M-S-l resize-pane -R 5

bind -n C-M-S-Left display-message "Use Ctrl-Meta(Alt)-Shift-h/j/k/l for pane resize"
bind -n C-M-S-Right display-message "Use Ctrl-Meta(Alt)-Shift-h/j/k/l for pane resize"
bind -n C-M-S-Up display-message "Use Ctrl-Meta(Alt)-Shift-h/j/k/l for pane resize"
bind -n C-M-S-Down display-message "Use Ctrl-Meta(Alt)-Shift-h/j/k/l for pane resize"

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c run-shell -b 'tmux new-window -c "#{pane_current_path}" "$(#{@tmux-support}/current-shell.sh)"'
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-j select-window -t -1
bind -n M-k select-window -t +1
bind -n M-Up display-message "Use Meta(Alt)-j/k for window navigation"
bind -n M-Down display-message "Use Meta(Alt)-j/k for window navigation"

bind -n M-J swap-window -t -1 \; select-window -t -1
bind -n M-K swap-window -t +1 \; select-window -t +1
bind -n M-S-Left display-message "Use Meta(Alt)-Shift-J/K for swap window"
bind -n M-S-Right display-message "Use Meta(Alt)-Shift-J/K for swap window"

bind -n M-w run-shell -b '#{@tmux-control}/window-switch.sh'

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C run-shell -b 'S=$(tmux new-session -d -c "#{pane_current_path}" -P "$(#{@tmux-support}/current-shell.sh)") && tmux switch-client -t "$S"'
bind K kill-session
unbind n
unbind p

bind -n M-h switch-client -n
bind -n M-l switch-client -p
bind -n M-Left display-message "Use Meta(Alt)-h/l for session navigation"
bind -n M-Right display-message "Use Meta(Alt)-h/l for session navigation"

bind -n M-s run-shell -b '#{@tmux-control}/switch-session.sh'
bind -n M-m run-shell -b '#{@tmux-control}/move-to-session.sh'

# Applications
bind S run-shell -b '#{@tmux-control}/auto-split.sh'

# bind A run-shell -b '#{@tmux-control}/auto-split.sh aichat'
# bind D run-shell -b "#{@tmux-control}/auto-split.sh ltp"
# bind E run-shell -b '#{@tmux-control}/auto-split.sh nvim'
# bind F run-shell -b '#{@tmux-control}/auto-split.sh yazi'
# bind G run-shell -b '#{@tmux-control}/auto-split.sh git log --graph --decorate --all'
# bind T run-shell -b '#{@tmux-control}/auto-split.sh btop'
# bind U run-shell -b '#{@tmux-control}/auto-split.sh gdu'

# Pop-ups (shared popup window for app TUIs)
set -g @tui-popup 'display-popup -E -w 80% -h 80% -d "#{pane_current_path}"'
bind ` run-shell -b 'tmux display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$(#{@tmux-support}/current-shell.sh)"'

bind D run-shell -b 'tmux #{@tui-popup} "#{@tmux-support}/popups tree" || true'
bind E run-shell -b 'tmux #{@tui-popup} nvim'
bind F run-shell -b 'tmux #{@tui-popup} yazi'
bind G run-shell -b 'tmux #{@tui-popup} git log --graph --decorate --all || true'
bind T run-shell -b 'tmux #{@tui-popup} btop'
bind U run-shell -b 'tmux #{@tui-popup} gdu'

bind A if-shell -b 'command -v wiremix' 'run-shell -b "tmux #{@tui-popup} wiremix"' 'display-message "Audio control not available"'
bind B if-shell -b 'command -v bluetui' 'run-shell -b "tmux #{@tui-popup} bluetui"' 'display-message "Bluetooth control not available"'
bind W if-shell -b 'command -v impala'  'run-shell -b "tmux #{@tui-popup} impala"'  'display-message "Wifi control not available"'

# Speech recording
bind -n M-v run-shell -b '#{@tmux-scripts}/record.sh'

# Help
bind -n M-? run-shell -b '#{@tmux-support}/keymap.sh'

# Debug: view move-to-session log (DEBUG=1 to enable logging)
bind -n M-P run-shell -b 'DEBUG=1 #{@tmux-control}/move-to-session.sh'
