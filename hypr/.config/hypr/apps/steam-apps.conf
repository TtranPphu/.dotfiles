# Proton / Steam Linux Runtime games
windowrule = fullscreen on, match:class ^steam_app_\d+$
windowrule = tag -default-opacity, match:class ^steam_app_\d+$
windowrule = opacity 1 1, match:class ^steam_app_\d+$
windowrule = idle_inhibit fullscreen, match:class ^steam_app_\d+$

# Native Linux Steam games
# Brotato has initialClass=Godot (changes to Brotato later), DST uses dontstarve_steam_x64
windowrule = fullscreen on, match:class ^dontstarve_steam_x64$
windowrule = tag -default-opacity, match:class ^dontstarve_steam_x64$
windowrule = opacity 1 1, match:class ^dontstarve_steam_x64$
windowrule = idle_inhibit fullscreen, match:class ^dontstarve_steam_x64$

# Godot creates window with class=Godot, then switches to game class after init
windowrule = fullscreen on, match:class ^Godot$
windowrule = tag -default-opacity, match:class ^Godot$
windowrule = opacity 1 1, match:class ^Godot$
windowrule = idle_inhibit fullscreen, match:class ^Godot$

# Re-apply after Godot engine sets final class
windowrule = fullscreen on, match:class ^Brotato$
windowrule = tag -default-opacity, match:class ^Brotato$
windowrule = opacity 1 1, match:class ^Brotato$
windowrule = idle_inhibit fullscreen, match:class ^Brotato$
